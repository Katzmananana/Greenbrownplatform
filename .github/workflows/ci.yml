name: CI

# All §7 blocking gates. A failed job fails the workflow and must block merge.
# Require these GitHub check names in branch protection:
#   lint, typecheck, unit, functional, e2e, reviewer, acceptance,
#   sast, load, load-staging, fix-loop, gates-required
on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  GATE_STUB: "1"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm typecheck

  unit:
    name: unit
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm test:unit

  functional:
    name: functional
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm test:functional

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm test:e2e

  reviewer:
    name: reviewer
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - name: Run reviewer gate
        env:
          REVIEWER_TOKEN: ${{ secrets.REVIEWER_TOKEN }}
        run: node scripts/gates/reviewer.mjs

  acceptance:
    name: acceptance
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - name: Acceptance vs original requirement
        env:
          REQUIREMENT_PATH: fixtures/requirement.md
        run: node scripts/gates/acceptance.mjs

  sast:
    name: sast
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/gates/sast.mjs

  load:
    name: load
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: node scripts/gates/load.mjs

  load-staging:
    name: load-staging
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - name: Staging load/perf placeholder
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
        run: node scripts/gates/load-staging.mjs

  fix-loop:
    name: fix-loop
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - name: Record fix-loop retry cap from org_config
        run: node scripts/gates/fix-loop.mjs

  safety-integration:
    name: safety-integration
    runs-on: ubuntu-latest
    continue-on-error: false
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gb
          POSTGRES_PASSWORD: gb
          POSTGRES_DB: gb_safety
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gb -d gb_safety"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GB_REQUIRE_SAFETY_INTEGRATION: "1"
      GB_TEST_DATABASE_URL: postgresql://gb:gb@localhost:5432/gb_safety
      GB_TEST_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @gb/shared build && pnpm --filter @gb/credits build && pnpm --filter @gb/gates build
      - name: Postgres and Redis safety suite
        run: pnpm --filter @gb/orchestrator exec vitest run test/safety.integration.test.ts

  gates-required:
    name: gates-required
    needs:
      - lint
      - typecheck
      - unit
      - functional
      - e2e
      - reviewer
      - acceptance
      - sast
      - load
      - load-staging
      - fix-loop
      - safety-integration
    runs-on: ubuntu-latest
    steps:
      - name: All §7 blocking gates and the safety integration suite passed
        run: echo "lint typecheck unit functional e2e reviewer acceptance sast load load-staging fix-loop safety-integration — all green"
